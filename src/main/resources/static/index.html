<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Fee Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            margin-top: 5px;
        }

        header button {
            float: right;
            margin-top: -35px;
            background: white;
            color: #1e3a8a;
        }

        header button:hover {
            background: #e5e7eb;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card,
        .form-section,
        .table-section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            color: #555;
            margin-bottom: 10px;
        }

        .number {
            font-size: 28px;
            font-weight: bold;
            color: #1e3a8a;
        }

        .form-section {
            margin-bottom: 30px;
        }

        h2 {
            margin-bottom: 20px;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            padding: 10px 14px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 3px;
        }

        button:hover {
            background: #162d6b;
        }

        .delete-btn {
            background: #dc2626;
        }

        .payment-btn {
            background: #15803d;
        }

        .history-btn {
            background: #7c3aed;
        }

        .edit-btn {
            background: #d97706;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f1f5f9;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }

        .search-box {
            width: 100%;
            margin-bottom: 20px;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        @media (max-width: 900px) {
            .dashboard {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 700px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Smart Fee Management System</h1>
        <p>Student Fee Management Dashboard</p>
        <button type="button" onclick="logout()">Logout</button>
    </header>

    <div class="container">

        <div class="dashboard">

            <div class="card">
                <h3>Total Students</h3>
                <div class="number" id="totalStudents">0</div>
            </div>

            <div class="card">
                <h3>Total Fees</h3>
                <div class="number" id="totalFees">₹0.00</div>
            </div>

            <div class="card">
                <h3>Paid Fees</h3>
                <div class="number" id="paidFees">₹0.00</div>
            </div>

            <div class="card">
                <h3>Pending Fees</h3>
                <div class="number" id="pendingFees">₹0.00</div>
            </div>

        </div>

        <div class="form-section">

            <h2>Add Student</h2>

            <form id="studentForm">

                <input type="text" id="studentId" placeholder="Student ID" required>

                <input type="text" id="name" placeholder="Student Name" required>

                <input type="text" id="usn" placeholder="USN" required>

                <input type="email" id="email" placeholder="Email" required>

                <input type="text" id="phone" placeholder="Phone Number" required>

                <input type="text" id="course" placeholder="Course" required>

                <input type="number" id="semester" placeholder="Semester" min="1" required>

                <input type="number" id="totalFee" placeholder="Total Fee" min="0" step="0.01" required>

                <button type="submit">Add Student</button>

            </form>

            <div id="message" class="message"></div>

        </div>

        <div class="table-section">

            <h2>Students</h2>

            <input type="text" id="searchInput" class="search-box" placeholder="Search by Student ID, Name or USN...">

            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>USN</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Course</th>
                            <th>Semester</th>
                            <th>Total Fee</th>
                            <th>Paid Fee</th>
                            <th>Pending Fee</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="studentTable"></tbody>

                </table>

            </div>

        </div>

    </div>

    <script>

        // Protect dashboard
        if (sessionStorage.getItem("adminLoggedIn") !== "true") {
            window.location.href = "/login.html";
        }

        const form = document.getElementById("studentForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function (event) {

            event.preventDefault();

            const totalFee =
                Number(document.getElementById("totalFee").value);

            const student = {

                studentId:
                    document.getElementById("studentId").value,

                name:
                    document.getElementById("name").value,

                usn:
                    document.getElementById("usn").value,

                email:
                    document.getElementById("email").value,

                phone:
                    document.getElementById("phone").value,

                course:
                    document.getElementById("course").value,

                semester:
                    Number(document.getElementById("semester").value),

                totalFee: totalFee,

                paidFee: 0,

                pendingFee: totalFee,

                paymentStatus: "Pending",

                payments: []
            };

            try {

                const response = await fetch("/api/students", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(student)
                });

                if (!response.ok) {
                    throw new Error("Failed to add student");
                }

                message.textContent =
                    "Student added successfully!";

                message.style.display = "block";
                message.style.color = "green";

                form.reset();

                loadStudents();

            } catch (error) {

                console.error(error);

                message.textContent =
                    "Failed to add student.";

                message.style.display = "block";
                message.style.color = "red";
            }

        });


        async function loadStudents() {

            try {

                const response =
                    await fetch("/api/students");

                if (!response.ok) {
                    throw new Error("Failed to load students");
                }

                const students =
                    await response.json();

                const table =
                    document.getElementById("studentTable");

                table.innerHTML = "";

                if (students.length === 0) {

                    table.innerHTML = `
                        <tr>
                            <td colspan="12"
                                class="empty-message">
                                No students found.
                            </td>
                        </tr>
                    `;
                }

                students.forEach(function (student) {

                    const totalFee =
                        Number(student.totalFee || 0);

                    const paidFee =
                        Number(student.paidFee || 0);

                    let pendingFee =
                        Number(student.pendingFee);

                    if (isNaN(pendingFee)) {
                        pendingFee = totalFee - paidFee;
                    }

                    let paymentStatus =
                        student.paymentStatus;

                    if (!paymentStatus) {

                        if (paidFee >= totalFee) {
                            paymentStatus = "Paid";
                        } else if (paidFee > 0) {
                            paymentStatus = "Partially Paid";
                        } else {
                            paymentStatus = "Pending";
                        }
                    }

                    const row =
                        document.createElement("tr");

                    row.innerHTML = `

                        <td>${student.studentId || ""}</td>

                        <td>${student.name || ""}</td>

                        <td>${student.usn || ""}</td>

                        <td>${student.email || ""}</td>

                        <td>${student.phone || ""}</td>

                        <td>${student.course || ""}</td>

                        <td>${student.semester || ""}</td>

                        <td>₹${totalFee.toFixed(2)}</td>

                        <td>₹${paidFee.toFixed(2)}</td>

                        <td>₹${pendingFee.toFixed(2)}</td>

                        <td>${paymentStatus}</td>

                        <td>

                            <button
                                class="edit-btn"
                                onclick="editStudent('${student.id}')">
                                Edit
                            </button>

                            <button
                                class="payment-btn"
                                onclick="recordPayment('${student.id}')">
                                Record Payment
                            </button>

                            <button
                                class="history-btn"
                                onclick="viewPaymentHistory('${student.id}')">
                                Payment History
                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteStudent('${student.id}')">
                                Delete
                            </button>

                        </td>
                    `;

                    table.appendChild(row);
                });

                updateDashboard(students);

            } catch (error) {

                console.error(
                    "Error loading students:",
                    error
                );
            }
        }


        function updateDashboard(students) {

            let totalFees = 0;
            let paidFees = 0;
            let pendingFees = 0;

            students.forEach(function (student) {

                const total =
                    Number(student.totalFee || 0);

                const paid =
                    Number(student.paidFee || 0);

                let pending =
                    Number(student.pendingFee);

                if (isNaN(pending)) {
                    pending = total - paid;
                }

                totalFees += total;
                paidFees += paid;
                pendingFees += pending;
            });

            document.getElementById("totalStudents").textContent =
                students.length;

            document.getElementById("totalFees").textContent =
                "₹" + totalFees.toFixed(2);

            document.getElementById("paidFees").textContent =
                "₹" + paidFees.toFixed(2);

            document.getElementById("pendingFees").textContent =
                "₹" + pendingFees.toFixed(2);
        }


        document.getElementById("searchInput")
            .addEventListener("input", function () {

                const search =
                    this.value.toLowerCase();

                const rows =
                    document.querySelectorAll("#studentTable tr");

                rows.forEach(function (row) {

                    const text =
                        row.textContent.toLowerCase();

                    if (text.includes(search)) {
                        row.style.display = "";
                    } else {
                        row.style.display = "none";
                    }
                });
            });


        async function recordPayment(studentId) {

            const value =
                prompt("Enter payment amount:");

            if (value === null) {
                return;
            }

            const amount =
                Number(value);

            if (isNaN(amount) || amount <= 0) {

                alert(
                    "Please enter a valid payment amount."
                );

                return;
            }

            try {

                const response =
                    await fetch(
                        "/api/students/" +
                        studentId +
                        "/payment",
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(amount)
                        }
                    );

                if (!response.ok) {

                    alert(
                        "Payment failed. Please check the amount."
                    );

                    return;
                }

                alert(
                    "Payment recorded successfully!"
                );

                loadStudents();

            } catch (error) {

                console.error(error);

                alert(
                    "Cannot connect to server."
                );
            }
        }


        async function viewPaymentHistory(studentId) {

            try {

                const response =
                    await fetch(
                        "/api/students/" +
                        studentId
                    );

                if (!response.ok) {

                    alert("Student not found.");

                    return;
                }

                const student =
                    await response.json();

                const payments =
                    student.payments || [];

                if (payments.length === 0) {

                    alert(
                        "No payments recorded for this student."
                    );

                    return;
                }

                let history =
                    "Payment History\n\n";

                payments.forEach(function (payment, index) {

                    const date =
                        new Date(payment.paymentDate);

                    history +=
                        (index + 1) +
                        ". ₹" +
                        Number(payment.amount || 0).toFixed(2) +
                        " - " +
                        date.toLocaleString() +
                        "\n";
                });

                history +=
                    "\nTotal Paid: ₹" +
                    Number(student.paidFee || 0).toFixed(2);

                alert(history);

            } catch (error) {

                console.error(error);

                alert(
                    "Cannot load payment history."
                );
            }
        }


        async function editStudent(studentId) {

            try {

                const response =
                    await fetch(
                        "/api/students/" +
                        studentId
                    );

                if (!response.ok) {

                    alert("Student not found.");

                    return;
                }

                const student =
                    await response.json();

                const name =
                    prompt(
                        "Student Name:",
                        student.name || ""
                    );

                if (name === null) return;

                const usn =
                    prompt(
                        "USN:",
                        student.usn || ""
                    );

                if (usn === null) return;

                const email =
                    prompt(
                        "Email:",
                        student.email || ""
                    );

                if (email === null) return;

                const phone =
                    prompt(
                        "Phone:",
                        student.phone || ""
                    );

                if (phone === null) return;

                const course =
                    prompt(
                        "Course:",
                        student.course || ""
                    );

                if (course === null) return;

                const semester =
                    Number(
                        prompt(
                            "Semester:",
                            student.semester
                        )
                    );

                const totalFee =
                    Number(
                        prompt(
                            "Total Fee:",
                            student.totalFee
                        )
                    );

                if (
                    isNaN(semester) ||
                    isNaN(totalFee)
                ) {

                    alert(
                        "Enter valid values."
                    );

                    return;
                }

                const paidFee =
                    Number(student.paidFee || 0);

                let pendingFee =
                    totalFee - paidFee;

                if (pendingFee < 0) {
                    pendingFee = 0;
                }

                let paymentStatus =
                    "Pending";

                if (paidFee >= totalFee) {

                    paymentStatus = "Paid";

                } else if (paidFee > 0) {

                    paymentStatus = "Partially Paid";
                }

                const updatedStudent = {

                    studentId:
                        student.studentId,

                    name:
                        name,

                    usn:
                        usn,

                    email:
                        email,

                    phone:
                        phone,

                    course:
                        course,

                    semester:
                        semester,

                    totalFee:
                        totalFee,

                    paidFee:
                        paidFee,

                    pendingFee:
                        pendingFee,

                    paymentStatus:
                        paymentStatus,

                    payments:
                        student.payments || []
                };

                const updateResponse =
                    await fetch(
                        "/api/students/" +
                        studentId,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(updatedStudent)
                        }
                    );

                if (!updateResponse.ok) {

                    throw new Error(
                        "Update failed"
                    );
                }

                alert(
                    "Student updated successfully!"
                );

                loadStudents();

            } catch (error) {

                console.error(error);

                alert(
                    "Unable to update student."
                );
            }
        }


        async function deleteStudent(studentId) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this student?"
                );

            if (!confirmDelete) {
                return;
            }

            try {

                const response =
                    await fetch(
                        "/api/students/" +
                        studentId,
                        {
                            method: "DELETE"
                        }
                    );

                if (!response.ok) {

                    throw new Error(
                        "Delete failed"
                    );
                }

                alert(
                    "Student deleted successfully!"
                );

                loadStudents();

            } catch (error) {

                console.error(error);

                alert(
                    "Unable to delete student."
                );
            }
        }


        // Logout
        function logout() {
            sessionStorage.removeItem("adminLoggedIn");
            window.location.href = "/login.html";
        }


        loadStudents();

    </script>

</body>

</html>
